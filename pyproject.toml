[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciwrite-lint"
version = "0.6.1"
description = "A linter for scientific manuscripts — reference verification, consistency checking, and structural validation."
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Sergey Samsonau" }]
maintainers = [{ name = "Authentic Research Partners LLC", email = "info@arpconnect.com" }]
readme = "README.md"
keywords = ["linter", "latex", "bibtex", "pdf", "scientific-writing", "academic-writing", "citation-checker", "reference-verification", "claim-verification", "manuscript", "peer-review", "arxiv", "vllm", "qwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "aiosqlite>=0.22",
    "loguru>=0.7",
    "anyascii>=0.3",
    "rich>=14.0",
    "defusedxml>=0.7",
    "pydantic>=2.10",
    "rapidfuzz>=3.0",
    "bibtexparser>=1.4",
    "pdfplumber>=0.11",
    "openai>=2.0",
    "grobid-tei-xml>=0.1",
    "sentence-transformers>=5.0",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
    "torch>=2.5",
    "transformers>=4.50",
    "Pillow>=12.3",
    "pypdf>=6.14.2",
    "pypdfium2>=5.0",
    "pdf2image>=1.17",
    "lxml>=6.1",
    "pypandoc-binary>=1.15",
    "rfc3986>=2.0",
    "psutil>=5.9",
    "annotated-types>=0.6",
]

[project.urls]
Homepage = "https://arpconnect.com"
Repository = "https://github.com/authentic-research-partners/sciwrite-lint"
Documentation = "https://github.com/authentic-research-partners/sciwrite-lint#readme"
Issues = "https://github.com/authentic-research-partners/sciwrite-lint/issues"
Paper = "https://arxiv.org/abs/2604.08501"

[project.optional-dependencies]
# `pip install -e ".[dev]"` brings in every tool used by the mandatory checks
# and the release pipeline. Exception: the `claude` CLI is a Node app —
# install separately per https://docs.anthropic.com/en/docs/claude-code.
dev = [
    # Mandatory checks — run after every code change
    "pytest>=9.0.3",
    "pytest-xdist>=3.0",
    "ruff>=0.15",
    "mypy>=1.18",
    "ast-grep-cli>=0.35",
    # Release pipeline (scripts/release.sh phases 3–6)
    "deptry>=0.25",
    "bandit>=1.9",
    "pip-audit>=2.10",
    "pip-licenses>=5.5",
    "twine>=6.0",
    "build>=1.0",
]

[project.scripts]
sciwrite-lint = "sciwrite_lint.__main__:main"

[tool.setuptools.packages.find]
include = ["sciwrite_lint*"]

[tool.setuptools.package-data]

